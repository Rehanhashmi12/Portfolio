<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Products</title>

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#111;
      color:white;
    }

    nav{
      background:#000;
      padding:15px;
      display:flex;
      gap:20px;
    }

    nav a{
      color:white;
      text-decoration:none;
      font-weight:bold;
    }

    nav a:hover{
      color:#25D366;
    }

    .container{
      padding:40px;
      text-align:center;
    }

    .products{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
      margin-top:40px;
    }

    .card{
      background:#1e1e1e;
      padding:20px;
      border-radius:15px;
    }

    .card img{
      width:100%;
      border-radius:10px;
    }

    .btn{
      display:inline-block;
      margin-top:15px;
      padding:10px 20px;
      background:#25D366;
      color:white;
      text-decoration:none;
      border-radius:8px;
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="digital-products.html">Digital Products</a>
  </nav>

  <div class="container">
    <h1>Digital Products</h1>
    <p>Templates, wallpapers and downloadable products.</p>

    <div class="products">

      <div class="card">
        <img src="https://via.placeholder.com/300x200" alt="">
        <h2> Templates</h2>
        <p>Editable Canva post pack.</p>
        <a class="btn" href="#">Buy Now</a>
      </div>

      <div class="card">
        <img src="https://via.placeholder.com/300x200" alt="">
        <h2>logo designs</h2>
        <p>High quality wallpaper collection.</p>
        <a class="btn" href="#">Download</a>
      </div>

    </div>
  </div>

</body>
</html>
